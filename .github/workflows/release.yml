name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0). Required for manual runs.'
        required: true
        type: string
      release_tag:
        description: 'Optional existing draft tag to rebuild; requires platform=all and unchanged application source.'
        required: false
        default: ''
        type: string
      platform:
        description: 'Platform to build (all / windows / macos / macos-arm64)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - macos-arm64

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      release_tag: ${{ steps.tag.outputs.tag }}
      release_name: ${{ steps.tag.outputs.name }}
      is_prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: set
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform || 'all' }}"
          if [ "$PLATFORM" = "windows" ]; then
            echo 'matrix={"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows-x64"}]}' >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            echo 'matrix={"include":[{"os":"macos-14","target":"aarch64-apple-darwin","label":"macOS-arm64"}]}' >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" = "macos" ]; then
            echo 'matrix={"include":[{"os":"macos-14","target":"aarch64-apple-darwin","label":"macOS-arm64"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","label":"macOS-x64"}]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"include":[{"os":"macos-14","target":"aarch64-apple-darwin","label":"macOS-arm64"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","label":"macOS-x64"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows-x64"}]}' >> $GITHUB_OUTPUT
          fi

      - id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$REBUILD_TAG" ]; then
            [[ "$REBUILD_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$REBUILD_TAG" = "v${{ inputs.version }}"
            test "${{ inputs.platform }}" = all
            test "$(gh release view "$REBUILD_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            echo "tag=$REBUILD_TAG" >> $GITHUB_OUTPUT
            echo "name=OpenJellyfish $REBUILD_TAG" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "name=OpenJellyfish $TAG" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            VER="${{ inputs.version }}"
            TAG="v${VER}-build${{ github.run_number }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "name=OpenJellyfish $TAG (manual build)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify application source for an existing-tag rebuild
        if: inputs.release_tag != ''
        env:
          REBUILD_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          git fetch origin "refs/tags/$REBUILD_TAG:refs/tags/$REBUILD_TAG"
          git diff --exit-code "$REBUILD_TAG" -- app config frontend launcher.py tauri-launcher/src-tauri/src tauri-launcher/src-tauri/build.rs tauri-launcher/src-tauri/Cargo.toml tauri-launcher/src-tauri/Cargo.lock tauri-launcher/dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Embedded Python installs native extensions; use a native runner for each target.
      - name: Verify native build architecture
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PYTHON'
          import os, platform
          target = os.environ["BUILD_TARGET"]
          actual = {"amd64": "x86_64", "arm64": "aarch64"}.get(platform.machine().lower(), platform.machine().lower())
          expected = target.split("-", 1)[0]
          if actual != expected:
              raise SystemExit(f"Native runner required: target={expected}, runner={actual}")
          print(f"Native build architecture verified: {actual}")
          PYTHON

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('tauri-launcher/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Set version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Test macOS release integrity and workspace migration
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_macos_release.py -v
          rustc --test tauri-launcher/src-tauri/src/macos_workspace.rs -o "$RUNNER_TEMP/workspace-tests"
          "$RUNNER_TEMP/workspace-tests"

      - name: Build release
        shell: bash
        run: |
          cd tauri-launcher
          python scripts/build.py --target ${{ matrix.target }} --version "$RELEASE_VERSION"

      - name: Explain macOS signing status
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo '### macOS: ad-hoc signed, not notarized' >> "$GITHUB_STEP_SUMMARY"
          echo 'DMG, nested signatures, native architecture and embedded runtimes were checked by build.py. Users must explicitly allow this app in macOS Privacy & Security. Developer ID signing and Apple notarization remain required for trusted public distribution.' >> "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          # Native builds use target/release; build.py verifies this exact DMG first.
          cp tauri-launcher/src-tauri/target/release/bundle/dmg/*.dmg dist/
          cp tauri-launcher/src-tauri/target/release/bundle/dmg/*.dmg.sha256 dist/
          cp docs/MACOS_INSTALL.md dist/MACOS_INSTALL-${{ matrix.target }}.md
          ls -la dist/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp tauri-launcher/src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          cp tauri-launcher/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          ls -la dist/

      # 直接上传到 GitHub Release，跳过 artifact 中转（artifact 配额已满）
      # softprops/action-gh-release 支持多 matrix job 并发追加到同一个 tag
      - name: Publish to GitHub Release (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/MACOS_INSTALL-*.md

      - name: Publish to GitHub Release (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.exe

  publish:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    name: Publish complete release
    steps:
      - uses: actions/checkout@v4
      - name: Require all installers and publish dependency constraints
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP'])/'release.json').read_text())
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          expected = [f'OpenJellyfish_{version}_aarch64.dmg', f'OpenJellyfish_{version}_x64.dmg', f'OpenJellyfish_{version}_x64-setup.exe']
          expected += [name+'.sha256' for name in expected if name.endswith('.dmg')]
          assets = {item['name']: item for item in release['assets']}
          for name in expected:
              assert name in assets and assets[name]['state'] == 'uploaded' and assets[name]['size'] > 0, name
          PY
          cp constraints-release.txt "$RUNNER_TEMP/constraints-$RELEASE_TAG.txt"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/constraints-$RELEASE_TAG.txt" --clobber
          if [ -f "docs/release-$RELEASE_TAG.md" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "docs/release-$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  prune-cache:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    name: Prune old caches
    steps:
      - name: Delete caches beyond the 6 most recent per target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          for prefix in cargo-x86_64-pc-windows-msvc cargo-aarch64-apple-darwin cargo-x86_64-apple-darwin; do
            echo "=== Pruning caches with key prefix: $prefix ==="
            gh cache list --repo "$REPO" --key "$prefix" --limit 100 \
              --json id,key,createdAt --sort created_at --order desc \
              | jq -r '.[6:] | .[].id' \
              | while read -r cid; do
                  echo "  deleting cache id=$cid"
                  gh cache delete "$cid" --repo "$REPO" || true
                done
          done
          echo "=== Current cache usage ==="
          gh cache list --repo "$REPO" --limit 50 || true

      - name: Delete all workflow artifacts (artifact storage hygiene)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          echo "=== Listing artifacts ==="
          gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | "\(.id) \(.name) \(.size_in_bytes)"' \
            | while read -r id name size; do
                echo "  deleting artifact id=$id name=$name size=${size}B"
                gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
              done
          echo "=== Done ==="
